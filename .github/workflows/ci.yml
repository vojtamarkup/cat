name: CI

# KDY se má workflow spustit
on:
  # Při každém pushi do větve main
  push:
    branches: [main]
  # A u každého pull requestu (žádosti o sloučení změn)
  pull_request:

# CO se má udělat. Workflow se skládá z jobů (úloh), které běží souběžně.
jobs:
  # ===== Job 1: backend =====
  backend:
    # Na jakém systému job běží. GitHub půjčí čistý virtuální Linux,
    # po skončení ho smaže. Každé spuštění začíná načisto.
    runs-on: ubuntu-latest

    # Výchozí nastavení pro všechny příkazy "run" níže
    defaults:
      run:
        # Každý příkaz se spustí ve složce backend (jako "cd backend")
        working-directory: backend

    # Pomocné kontejnery, které poběží vedle jobu po celou dobu.
    # Stejné jako služba "db" v compose.yaml.
    services:
      # Jméno služby (může být jakékoliv)
      postgres:
        # Stejný image jako lokálně
        image: postgres:17
        # Proměnné prostředí pro kontejner: vytvoří uživatele a rovnou databázi cat_test
        env:
          POSTGRES_USER: cat
          POSTGRES_PASSWORD: cat
          POSTGRES_DB: cat_test
        # Port runneru : port v kontejneru.
        # 5433 jako lokálně, takže výchozí adresa v conftest.py sedí beze změny.
        ports:
          - 5433:5432
        # Healthcheck: GitHub počká, dokud databáze nepřijímá spojení,
        # a teprve pak spustí kroky níže (jako healthcheck v compose.yaml)
        options: >-
          --health-cmd "pg_isready -U cat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Kroky jobu, provádí se postupně shora dolů.
    # Když jeden selže, další se nespustí a celé CI je červené ❌.
    steps:
      # Stáhni kód z repa do runneru (jinak by tam nic nebylo)
      - name: Checkout
        uses: actions/checkout@v5           # "uses" = hotová akce od někoho jiného

      # Nainstaluj uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Nainstaluj knihovny podle uv.lock (i dev knihovny: pytest, ruff, respx)
      - name: Install dependencies
        run: uv sync --locked               # "run" = obyčejný příkaz v terminálu

      # Kontrola chyb v kódu (nepoužité importy apod.)
      - name: Lint
        run: uv run ruff check .

      # Kontrola, že je kód zformátovaný. Nic nepřepisuje, jen spadne, když není.
      - name: Format check
        run: uv run ruff format --check .

      # Spusť testy proti databázi cat_test ze "services"
      - name: Tests
        run: uv run pytest -v --cov=app --cov-report=xml

      # sonar
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ===== Job 2: frontend (běží souběžně s backendem) =====
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    # Frontend nepotřebuje databázi, proto nemá "services"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Nainstaluj Node.js (obdoba setup-uv)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm                                         # zrychlí instalaci při dalších bězích
          cache-dependency-path: frontend/package-lock.json

      # Nainstaluj knihovny přesně podle package-lock.json (obdoba uv sync --locked)
      - name: Install dependencies
        run: npm ci

      # Kontrola chyb v kódu (ESLint)
      - name: Lint
        run: npm run lint

      # Testy (Vitest)
      - name: Tests
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text

        # sonar
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      # Ověř, že jde frontend postavit (stejně jako v Dockerfile)
      - name: Build
        run: npm run build

    # ===== Job 3: SonarCloud (spustí se až po backendu a frontendu) =====
  sonar:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]       # počkej, až oba joby projdou

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0             # celá historie Gitu, SonarCloud z ní zjišťuje, co je nové

      # Stáhni reporty pokrytí z předchozích jobů
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Vitest píše cesty relativně k frontend/ (src/api.js),
      # SonarCloud je čte od kořene repa (frontend/src/api.js)
      - name: Fix frontend coverage paths
        run: sed -i 's|SF:src/|SF:frontend/src/|' frontend/coverage/lcov.info

      # Samotná analýza: pošle kód a reporty do SonarCloud
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===== Job 4: Docker image do GitHub Container Registry =====
  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]       # stav image jen když testy prošly

    # Jen při pushi do main (ne u pull requestů)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Oprávnění: číst kód a zapisovat do registry (packages)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # QEMU = emulátor, díky kterému jde na amd64 stroji postavit ARM image
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx = rozšíření docker build, umí víc architektur najednou
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Přihlášení do GHCR. GITHUB_TOKEN vytváří GitHub automaticky pro každý běh.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cat-backend:latest
            ghcr.io/${{ github.repository_owner }}/cat-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cat-frontend:latest
            ghcr.io/${{ github.repository_owner }}/cat-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===== Job 5: Nasazení na Oracle server =====
  deploy:
    runs-on: ubuntu-latest
    needs: docker                    # až jsou nové image v GHCR

    # Jen při pushi do main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Potřebujeme deploy/compose.prod.yaml z repa
      - name: Checkout
        uses: actions/checkout@v5

      # Připrav SSH: ulož klíč a přidej server mezi známé
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Zkopíruj aktuální compose na server (kdyby se změnil)
      - name: Copy compose file
        run: scp -i ~/.ssh/deploy_key deploy/compose.prod.yaml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/cat/compose.yaml

      # Na serveru stáhni nové image a restartuj, co se změnilo
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ~/cat && docker compose pull && docker compose up -d && docker image prune -f"