# 1) DISK pro data (obdoba volume db-data v Compose)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
spec:
  accessModes: ["ReadWriteOnce"]   # disk může mít připojený jen jeden pod
  resources:
    requests:
      storage: 1Gi                 # velikost
---
# 2) DATABÁZE (obdoba služby db v Compose)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1                      # databáze jen jednou
  strategy:
    type: Recreate                 # při změně: nejdřív vypni starou, pak zapni novou (disk se sdílet nedá)
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: cat
            - name: POSTGRES_DB
              value: cat
            - name: POSTGRES_PASSWORD      # heslo vezmi ze Secretu "db-secret" (obdoba .env)
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:                    # připoj disk do složky s daty
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:                  # obdoba healthcheck: je databáze připravená?
            exec:
              command: ["pg_isready", "-U", "cat"]
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data             # disk z části 1)
---
# 3) ADRESA "db" (backend se připojuje na db:5432)
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432