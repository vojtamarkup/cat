apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cat
spec:
  replicas: 2                              # dvě kopie
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vojtamarkup/cat-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cat
spec:
  selector:
    app: frontend                          # pošli provoz na obě kopie
  ports:
    - port: 80