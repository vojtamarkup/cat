# Identifikace projektu v SonarCloud
sonar.projectKey=vojtamarkup_cat
sonar.organization=vojtamarkup

# Kde je kód aplikace
sonar.sources=backend/app,frontend/src
# Testovací soubory nepočítej jako kód aplikace
sonar.exclusions=**/*.test.js

# Kde jsou testy
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,**/*.test.js

# Verze Pythonu
sonar.python.version=3.14

# Kde najde reporty pokrytí (vyrobí je joby backend a frontend)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info