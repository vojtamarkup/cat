server {
    listen 80;

    # Hotové soubory frontendu
    root /usr/share/nginx/html;
    index index.html;

    # Požadavky na /api/ přepošli na backend (stejně jako proxy ve Vite)
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Všechno ostatní jsou soubory frontendu
    location / {
        try_files $uri $uri/ /index.html;
    }
}